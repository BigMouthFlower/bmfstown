# ============================================================
# BMF's Town -- project configuration
# Version, mod name and package live here; reload Gradle after editing.
# ============================================================

# Heap size. 2G is plenty for mod development; raise to 3G when testing big packs.
# file.encoding=UTF-8: the daemon reads the game process's piped output with this charset.
# runClient's log goes: game -> pipe -> daemon -> IDEA console. If the daemon decodes
# the game's UTF-8 output as GBK (Windows default), you get mojibake like "闃跨" in IDEA.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is off until the build scripts settle; can be re-enabled later.
org.gradle.configuration-cache=false

# Tell Gradle where our JDK 21 lives (zip-extracted, not in a standard scan path).
# gradle-daemon-jvm.properties demands toolchainVersion=21; without this line Gradle
# can't see D:/Java/java21 (graalvm-21 gets excluded by nativeImageCapable=false),
# falls back to downloading and dies with "No defined toolchain download url".
org.gradle.java.installations.paths=D:/Java/java21

# Parchment parameter-name mappings: readable names (player) instead of p_1234_.
# Latest: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ============================================================
# Environment Properties
# Version matrix: https://projects.neoforged.net/neoforged/neoforge
# Minecraft version must match the NeoForge version, otherwise resolution fails.
# ============================================================
minecraft_version=1.21.1
# Accepted Minecraft range: exactly 1.21.1.
minecraft_version_range=[1.21.1]
# NeoForge version used at build time (determines available APIs).
neo_version=21.1.262
loader_version_range=[1,)

# ============================================================
# Mod Properties
# ============================================================

# Mod id: lowercase, matching [a-z][a-z0-9_]{1,63}.
# Must equal the constant in @Mod; also determines the assets/ directory name.
mod_id=bmfstown
mod_name=BMF's Town
mod_license=All Rights Reserved
mod_version=0.9.1
# Base package, must match the source directory layout.
mod_group_id=com.bmf.bmfstown

# Author, shown in the Mods list.
mod_authors=BMF
# One-line summary shown in the Mods detail view.
mod_description=A town mod: NPC settlers who eat your surplus food and do the tedious work for you.

# ============================================================
# Proxy for a local client such as Clash Verge; change the port if needed.
# The systemProp. prefix passes a JVM system property to the Gradle daemon itself,
# so only dependency downloads and MC decompilation go through it; nonProxyHosts keeps localhost direct.
# If 7897 is not your port, edit the four lines below; comment them out if you have no proxy.
# ============================================================
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.*|[::1]
systemProp.https.nonProxyHosts=localhost|127.*|[::1]
