# Gradle daemon JVM version.
# Forces gradlew to launch the Gradle daemon with JDK 21, ignoring the system JAVA_HOME.
# Without this, a machine whose JAVA_HOME points to JDK 8 will fail with:
#   "Gradle requires JVM 17 or later to run. Your build is currently configured to use JVM 8."
# Vendor is intentionally not pinned: any vendor's JDK 21 works.
# If no JDK 21 is installed locally, Gradle will download one (via the proxy in gradle.properties).
toolchainVersion=21
